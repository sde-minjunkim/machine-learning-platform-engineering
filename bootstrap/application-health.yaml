apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.argoproj.io_Application: "local hs = {status = \"\
    Progressing\", message = \"Waiting for child Application reconciliation\"}\nif\
    \ obj.status == nil then\n  return hs\nend\nif obj.status.operationState ~= nil\
    \ then\n  local phase = obj.status.operationState.phase\n  if phase == \"Failed\"\
    \ or phase == \"Error\" then\n    return {status = \"Degraded\", message = obj.status.operationState.message}\n\
    \  end\nend\nif obj.status.sync == nil or obj.status.sync.status ~= \"Synced\"\
    \ then\n  hs.message = \"Waiting for child Application sync\"\n  return hs\nend\n\
    if obj.status.health ~= nil then\n  hs.status = obj.status.health.status\n  hs.message\
    \ = obj.status.health.message\nend\nreturn hs\n"
