apiVersion: batch/v1
kind: Job
metadata:
  name: tensorboard-image-build-v1
  namespace: kubeflow
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
      - name: prepare-context
        image: busybox:1.36.1
        command: [sh, -c, "cp -RL /source/. /workspace/"]
        volumeMounts:
        - name: source
          mountPath: /source
        - name: workspace
          mountPath: /workspace
      containers:
      - name: builder
        image: quay.io/bentoml/kaniko:debug
        command: [/kaniko/executor]
        env:
        - name: DOCKER_CONFIG
          value: /kaniko/.docker/
        args:
        - --context=dir:///workspace
        - --dockerfile=/workspace/Dockerfile
        - --destination=gitea-http.gitea.svc.cluster.local:3000/admin/tensorboard:2.20.0
        - --insecure
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: registry
          mountPath: /kaniko/.docker/
      volumes:
      - name: workspace
        emptyDir: {}
      - name: registry
        secret:
          secretName: income-classifier-registry
          items:
          - key: .dockerconfigjson
            path: config.json
      - name: source
        configMap:
          name: tensorboard-image-source-v1
