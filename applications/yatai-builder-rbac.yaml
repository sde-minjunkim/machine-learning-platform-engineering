apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yatai-image-builder-secret-cache
  namespace: yatai-system
rules:
- apiGroups: ['']
  resources: [secrets]
  verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yatai-image-builder-secret-cache
  namespace: yatai-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: yatai-image-builder-secret-cache
subjects:
- kind: ServiceAccount
  name: yatai-image-builder
  namespace: yatai-image-builder
