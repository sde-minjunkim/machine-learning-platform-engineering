apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations: {}
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.7.0
    helm:
      releaseName: gitea
      valuesObject:
        replicaCount: 1
        strategy:
          type: Recreate
          rollingUpdate: null
        postgresql-ha:
          enabled: false
        postgresql:
          enabled: false
        valkey-cluster:
          enabled: false
        valkey:
          enabled: false
        service:
          http:
            type: NodePort
            nodePort: 0
          ssh:
            type: NodePort
            nodePort: 0
        persistence:
          storageClass: ''
          size: 10Gi
          create: true
          claimName: gitea-data
        preExtraInitContainers:
        - name: volume-permissions
          image: docker.gitea.com/gitea:1.27.0-rootless
          command:
          - sh
          - -c
          - chown 1000:1000 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
          - name: data
            mountPath: /data
        gitea:
          additionalConfigFromEnvs:
          - name: GITEA__database__PASSWD
            valueFrom:
              secretKeyRef:
                name: gitea-db-credentials
                key: password
          admin:
            existingSecret: gitea-admin
            email: ''
          config:
            database:
              DB_TYPE: postgres
              HOST: ''
              NAME: gitea
              USER: admin
              SSL_MODE: require
            session:
              PROVIDER: memory
            cache:
              ADAPTER: memory
            queue:
              TYPE: level
            server:
              DOMAIN: ''
              ROOT_URL: ''
              SSH_DOMAIN: ''
              SSH_PORT: 0
            actions:
              ENABLED: true
        deployment:
          env:
          - name: GITEA_RUNNER_REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-runner-token
                key: token
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
