apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.7.0
    helm:
      releaseName: gitea
      valuesObject:
        replicaCount: 1
        strategy:
          type: Recreate
          rollingUpdate: null
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        nodeSelector:
          kubernetes.io/hostname: debian
        postgresql-ha:
          enabled: false
        postgresql:
          enabled: false
        valkey-cluster:
          enabled: false
        valkey:
          enabled: false
        service:
          http:
            type: NodePort
            nodePort: 30080
          ssh:
            type: NodePort
            nodePort: 30222
        persistence:
          storageClass: local-path
          size: 10Gi
          create: true
          claimName: gitea-data
        preExtraInitContainers:
        - name: volume-permissions
          image: docker.gitea.com/gitea:1.27.0-rootless
          command:
          - sh
          - -c
          - chown 1000:1000 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
          - name: data
            mountPath: /data
        gitea:
          additionalConfigFromEnvs:
          - name: GITEA__database__PASSWD
            valueFrom:
              secretKeyRef:
                name: gitea-db-credentials
                key: password
          admin:
            existingSecret: gitea-admin
            email: admin@localhost.localdomain
          config:
            database:
              DB_TYPE: postgres
              HOST: gitea-db-rw.gitea.svc.cluster.local:5432
              NAME: gitea
              USER: admin
              SSL_MODE: require
            session:
              PROVIDER: memory
            cache:
              ADAPTER: memory
            queue:
              TYPE: level
            server:
              DOMAIN: 192.168.1.254
              ROOT_URL: http://192.168.1.254:30080/
              SSH_DOMAIN: 192.168.1.254
              SSH_PORT: 30222
            actions:
              ENABLED: true
        deployment:
          env:
          - name: GITEA_RUNNER_REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-runner-token
                key: token
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
