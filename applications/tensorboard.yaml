apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tensorboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sde-minjunkim/machine-learning-platform-engineering
    targetRevision: main
    path: applications/charts/tensorboard
    helm:
      releaseName: tensorboard
      valuesObject:
        logClaimName: tensorboard-logs
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
