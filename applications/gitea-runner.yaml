apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-runner
  namespace: argocd
  annotations: {}
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: actions
    targetRevision: 0.1.2
    helm:
      releaseName: gitea-runner
      valuesObject:
        enabled: true
        existingSecret: gitea-runner-token
        existingSecretKey: token
        giteaRootURL: http://192.168.1.254:30080/
        global:
          storageClass: local-path
        statefulset:
          timezone: Asia/Seoul
          nodeSelector:
            kubernetes.io/hostname: debian
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          persistence:
            size: 1Gi
          runner:
            extraEnvs:
            - name: GITEA_RUNNER_NAME
              value: gitea-runner
          extraVolumes:
          - name: docker-data
            emptyDir: {}
          dind:
            extraVolumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
        fullnameOverride: gitea
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
