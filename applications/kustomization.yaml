apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cnpg.yaml
- gitea-db.yaml
- gitea.yaml
- gitea-runner.yaml
- secrets.yaml
- runner-token.yaml
- seaweedfs.yaml
- mlflow-db.yaml
- mlflow.yaml
configMapGenerator:
- name: deployment-environment
  envs:
  - environment.env
  options:
    annotations:
      config.kubernetes.io/local-config: 'true'
replacements:
- source:
    kind: ConfigMap
    name: deployment-environment
    fieldPath: data.ID
  targets:
  - select:
      kind: Secret
      name: gitea-db-credentials
    fieldPaths:
    - stringData.username
  - select:
      kind: Application
      name: gitea-db
    fieldPaths:
    - spec.source.helm.valuesObject.cluster.initdb.owner
  - select:
      kind: Application
      name: gitea-db
    fieldPaths:
    - spec.source.helm.valuesObject.cluster.roles.0.name
  - select:
      kind: Application
      name: gitea
    fieldPaths:
    - spec.source.helm.valuesObject.gitea.config.database.USER
  - select:
      kind: Secret
      name: gitea-admin
    fieldPaths:
    - stringData.username
  - select:
      kind: Secret
      name: mlflow-db-credentials
    fieldPaths:
    - stringData.username
  - select:
      kind: Secret
      name: mlflow-s3-credentials
    fieldPaths:
    - stringData.AWS_ACCESS_KEY_ID
  - select:
      kind: Secret
      name: seaweedfs-credentials
    fieldPaths:
    - stringData.AWS_ACCESS_KEY_ID
  - select:
      kind: Application
      name: mlflow-db
    fieldPaths:
    - spec.source.helm.valuesObject.cluster.initdb.owner
    - spec.source.helm.valuesObject.cluster.roles.0.name
- source:
    kind: ConfigMap
    name: deployment-environment
    fieldPath: data.PW
  targets:
  - select:
      kind: Secret
      name: gitea-db-credentials
    fieldPaths:
    - stringData.password
  - select:
      kind: Secret
      name: gitea-admin
    fieldPaths:
    - stringData.password
  - select:
      kind: Secret
      name: mlflow-db-credentials
    fieldPaths:
    - stringData.password
  - select:
      kind: Secret
      name: mlflow-s3-credentials
    fieldPaths:
    - stringData.AWS_SECRET_ACCESS_KEY
  - select:
      kind: Secret
      name: seaweedfs-credentials
    fieldPaths:
    - stringData.AWS_SECRET_ACCESS_KEY
