apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cnpg.yaml
- gitea-db.yaml
- gitea.yaml
- gitea-runner.yaml
- secrets.yaml
- runner-token.yaml
configMapGenerator:
- name: deployment-environment
  envs:
  - environment.env
  options:
    annotations:
      config.kubernetes.io/local-config: 'true'
replacements:
- source:
    kind: ConfigMap
    name: deployment-environment
    fieldPath: data.ID
  targets:
  - select:
      kind: Secret
      name: gitea-db-credentials
    fieldPaths:
    - stringData.username
  - select:
      kind: Application
      name: gitea-db
    fieldPaths:
    - spec.source.helm.valuesObject.cluster.initdb.owner
  - select:
      kind: Application
      name: gitea-db
    fieldPaths:
    - spec.source.helm.valuesObject.cluster.roles.0.name
  - select:
      kind: Application
      name: gitea
    fieldPaths:
    - spec.source.helm.valuesObject.gitea.config.database.USER
  - select:
      kind: Secret
      name: gitea-admin
    fieldPaths:
    - stringData.username
- source:
    kind: ConfigMap
    name: deployment-environment
    fieldPath: data.PW
  targets:
  - select:
      kind: Secret
      name: gitea-db-credentials
    fieldPaths:
    - stringData.password
  - select:
      kind: Secret
      name: gitea-admin
    fieldPaths:
    - stringData.password
