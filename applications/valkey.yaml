apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations: {}
spec:
  project: default
  source:
    repoURL: https://valkey.io/valkey-helm/
    chart: valkey
    targetRevision: 0.12.1
    helm:
      releaseName: valkey
      valuesObject:
        fullnameOverride: valkey
        dataStorage:
          enabled: true
          requestedSize: 10Gi
        deploymentStrategy: Recreate
        valkeyConfig: |
          appendonly yes
  destination:
    server: https://kubernetes.default.svc
    namespace: valkey
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
