apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitea-runner-data
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef:
    namespace: gitea
    name: data-runner-gitea-runner-runner-0
  hostPath:
    path: /var/lib/gitea-runner
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - debian
