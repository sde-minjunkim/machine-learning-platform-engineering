apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitea-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef:
    namespace: gitea
    name: gitea-shared-storage
  hostPath:
    path: /var/lib/gitea
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - debian
