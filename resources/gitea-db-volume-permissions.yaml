apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-db-volume-permissions
  namespace: gitea
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: debian
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: prepare
        image: busybox:1.38.0
        command:
        - sh
        - -ec
        - chown 26:26 /data; chmod 700 /data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        hostPath:
          path: /var/lib/cnpg/gitea-db
          type: DirectoryOrCreate
