apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitea-cnpg-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gitea-cnpg-static
  claimRef:
    namespace: gitea
    name: gitea-db-1
  hostPath:
    path: /var/lib/cnpg/gitea-db
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - debian
