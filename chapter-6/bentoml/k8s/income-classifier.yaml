apiVersion: resources.yatai.ai/v1alpha1
kind: BentoRequest
metadata:
  name: income-classifier-service
  namespace: yatai
spec:
  bentoTag: income_classifier_service:thd727w2xcuwzws5
  image: gitea-http.gitea.svc.cluster.local:3000/admin/income-classifier:runtime-config
---
apiVersion: serving.yatai.ai/v2alpha1
kind: BentoDeployment
metadata:
  name: income-classifier-service
  namespace: yatai
spec:
  bento: income-classifier-service
  ingress:
    enabled: false
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  runners:
  - name: random-forest-classifier
    autoscaling:
      minReplicas: 1
      maxReplicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 500Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
  envs:
  - name: PROJECT_ENV
    valueFrom:
      secretKeyRef:
        name: income-classifier-env
        key: project.env
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: income-classifier-env
        key: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: income-classifier-env
        key: AWS_SECRET_ACCESS_KEY
  - name: AWS_ENDPOINT_URL
    valueFrom:
      secretKeyRef:
        name: income-classifier-env
        key: AWS_ENDPOINT_URL
  - name: MLFLOW_S3_ENDPOINT_URL
    valueFrom:
      secretKeyRef:
        name: income-classifier-env
        key: MLFLOW_S3_ENDPOINT_URL
  - name: AWS_DEFAULT_REGION
    valueFrom:
      secretKeyRef:
        name: income-classifier-env
        key: AWS_DEFAULT_REGION
