apiVersion: resources.yatai.ai/v1alpha1
kind: BentoRequest
metadata:
  name: income-classifier-service
  namespace: yatai
spec:
  bentoTag: income_classifier_service:thd727w2xcuwzws5
  image: gitea-http.gitea.svc.cluster.local:3000/admin/income-classifier:runtime-secret
---
apiVersion: serving.yatai.ai/v2alpha1
kind: BentoDeployment
metadata:
  name: income-classifier-service
  namespace: yatai
spec:
  bento: income-classifier-service
  ingress:
    enabled: false
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  runners:
  - name: random-forest-classifier
    autoscaling:
      minReplicas: 1
      maxReplicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 500Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
  extraPodSpec:
    containers:
    - name: runtime-settings
      image: gitea-http.gitea.svc.cluster.local:3000/admin/income-classifier:runtime-secret
      command:
      - python
      - -c
      - import os,time; from pathlib import Path; p=Path("/dev/shm/runtime.env.tmp");
        p.write_text(os.environ["PROJECT_ENV"]); p.chmod(0o600); p.rename("/dev/shm/runtime.env");
        time.sleep(2147483647)
      env:
      - name: PROJECT_ENV
        valueFrom:
          secretKeyRef:
            name: income-classifier-env
            key: project.env
      volumeMounts:
      - name: shared-memory
        mountPath: /dev/shm
